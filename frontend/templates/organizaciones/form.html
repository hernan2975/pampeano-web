{% extends "base.html" %}

{% block title %}{{ 'Editar' if organizacion else 'Nueva' }} Organización - Pampeano Web{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ 'Editar' if organizacion else 'Nueva' }} Organización</h2>
    
    <form method="post" 
          hx-{{ 'patch' if organizacion else 'post' }} 
          hx-target="#main-content" 
          hx-swap="innerHTML">
        {% if organizacion %}
        <input type="hidden" name="id" value="{{ organizacion.id }}">
        {% endif %}
        
        <div class="form-group">
            <label for="nombre">Nombre *</label>
            <input type="text" 
                   id="nombre" 
                   name="nombre" 
                   value="{{ organizacion.nombre if organizacion else '' }}" 
                   required>
        </div>
        
        <div class="form-group">
            <label for="tipo">Tipo *</label>
            <select id="tipo" name="tipo" required>
                <option value="">Seleccione...</option>
                <option value="cooperativa" {% if organizacion and organizacion.tipo == 'cooperativa' %}selected{% endif %}>
                    Cooperativa
                </option>
                <option value="centro_cultural" {% if organizacion and organizacion.tipo == 'centro_cultural' %}selected{% endif %}>
                    Centro Cultural
                </option>
                <option value="huerta" {% if organizacion and organizacion.tipo == 'huerta' %}selected{% endif %}>
                    Huerta Colectiva
                </option>
                <option value="asamblea" {% if organizacion and organizacion.tipo == 'asamblea' %}selected{% endif %}>
                    Asamblea Barrial
                </option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="localidad">Localidad *</label>
            <input type="text" 
                   id="localidad" 
                   name="localidad" 
                   value="{{ organizacion.localidad if organizacion else '' }}" 
                   required>
        </div>
        
        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" 
                      name="descripcion" 
                      rows="4">{{ organizacion.descripcion if organizacion else '' }}</textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn">
                {{ 'Actualizar' if organizacion else 'Crear' }}
            </button>
            <a href="/organizaciones" class="btn" style="background:#6c757d;">Cancelar</a>
        </div>
    </form>
</div>

<style>
.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1rem;
}

.form-group textarea {
    resize: vertical;
    min-height: 100px;
}

.form-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
}
</style>
{% endblock %}
