<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Pampeano Web</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="container">
        <div class="card" style="max-width: 400px; margin: 2rem auto;">
            <h2>🔐 Iniciar Sesión</h2>
            
            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="post" action="/auth/token" hx-post="/auth/token" hx-target="#login-form" hx-swap="outerHTML">
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" value="admin" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" value="pampeano2025" required>
                </div>
                
                <button type="submit" class="btn" style="width: 100%;">Entrar</button>
            </form>
            
            <div class="form-note">
                <p><strong>Datos de prueba:</strong></p>
                <p>Usuario: <code>admin</code><br>
                Contraseña: <code>pampeano2025</code></p>
            </div>
        </div>
    </div>
    
    <style>
    .form-group {
        margin-bottom: 1rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }
    
    .form-group input {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
    }
    
    .form-note {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #e9ecef;
        border-radius: 4px;
        font-size: 0.9rem;
    }
    
    .form-note code {
        background: #264653;
        color: white;
        padding: 0.2rem 0.4rem;
        border-radius: 3px;
    }
    </style>
    
    <script src="/static/js/htmx.min.js"></script>
</body>
</html>
